name: ANRE installed capacity totals

# Weekly: fetch ANRE's official installed capacity by primary energy type
# (https://anre.ro/puteri-instalate) into data/anre_totals.json, which the map's
# coverage panel compares with what it shows. Commits only when the figures change.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch totals
        run: python3 scripts/fetch_anre_totals.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/anre_totals.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/anre_totals.json
          git commit -m "ANRE installed capacity totals, $(python3 -c 'import json;print(json.load(open("data/anre_totals.json"))["as_of"])')"
          git push
