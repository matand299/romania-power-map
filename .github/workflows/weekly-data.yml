name: Weekly data update

# Every Monday: fetch Transelectrica's installed capacity files (official totals by fuel, storage
# installations, solar and wind plants), rebuild the map's data and commit any change. If the files
# cannot be fetched, the last good copy stays.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -q pandas openpyxl xlrd
      - name: Fetch Transelectrica files
        continue-on-error: true
        run: python3 scripts/fetch_transelectrica.py
      - name: Rebuild map data
        run: python3 scripts/build_data.py
      - name: Commit if changed
        run: |
          git add data/official_totals.json data/plants.json data/counties.json data/source/transelectrica
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly data update, $(date -u +%Y-%m-%d)"
          git push
